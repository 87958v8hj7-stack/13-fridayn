  const p = $('#pins'); if (!p) return;

  const runKeys = [...new Set(Object.values(WINS).filter(w => !w.modal).map(w => w.app))];
  const list = PINS.map(x => x[0]).concat(runKeys.filter(k => !PINS.some(x => x[0] === k)));

  $$('button', p).forEach(b => b.onclick = () => {
    const k = b.dataset.k, ws = Object.values(WINS).filter(w => w.app === k);

  });
}

/* 개발용: #os 바로 PC, #ta 바로 한공명 */
(function boot() {
  const h = location.hash;
  /* PC 전용 : 터치 기기이거나 창이 좁으면 막는다 */
  const blocked = () => !matchMedia('(pointer: fine)').matches || innerWidth < 1100 || innerHeight < 620;
  if (blocked() && h !== '#ta') {
    const d = document.createElement('div'); d.id = 'pconly';
    d.innerHTML = '<div><b>이 기록은 PC에서만 열람할 수 있습니다.</b>관리국 단말 화면을 재생하는 기록이라<br>마우스와 넓은 화면(가로 1100px 이상)이 필요합니다.<small>휴대폰 · 태블릿에서는 열리지 않습니다 · 창이 작다면 크게 늘려 주세요</small></div>';
    document.body.appendChild(d);
    const re = () => { if (!blocked()) { removeEventListener('resize', re); d.remove(); boot(); } };
    addEventListener('resize', re); return;
  }
  if (h === '#ta') { $('#gate').hidden = true; SPEED = 8; startTA(); return; }
  if (h === '#os') { $('#gate').hidden = true; startPC(); return; }
  gate();
})();
